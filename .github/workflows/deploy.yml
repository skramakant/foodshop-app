name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into api.js
        run: |
          sed -i "s|REPLACE_WITH_GAS_API_URL|${{ secrets.GAS_API_URL }}|g" frontend/public/js/api.js
          sed -i "s|REPLACE_WITH_YOUR_API_KEY|${{ secrets.GAS_API_KEY }}|g" frontend/public/js/api.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public
      - uses: actions/deploy-pages@v4
        id: deployment
